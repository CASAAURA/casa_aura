<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="horizon-clip">
      <rect x="0" y="0" width="200" height="120" />
    </clipPath>
  </defs>
  <style>
    /* Animación de la línea de horizonte */
    .horizon {
      stroke-dasharray: 120;
      stroke-dashoffset: 120;
      animation: draw-horizon 1.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }
    
    /* El cuerpo del sol sale desde atrás del horizonte */
    .sun-body {
      clip-path: url(#horizon-clip);
      animation: rise 1.8s cubic-bezier(0.25, 1, 0.3, 1) forwards;
    }
    
    /* Los rayos se dibujan hacia afuera */
    .ray {
      stroke-dasharray: 15;
      stroke-dashoffset: 15;
      opacity: 0;
      animation: draw-ray 1s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }
    
    /* Efecto de brillo/pulsación infinita en los contenedores de los rayos */
    .ray-group {
      animation: shimmer 3s ease-in-out infinite;
    }
    
    /* Retraso de dibujo para cada rayo individual */
    .ray-1 { animation-delay: 1.0s; }
    .ray-2 { animation-delay: 1.1s; }
    .ray-3 { animation-delay: 1.2s; }
    .ray-4 { animation-delay: 1.3s; }
    .ray-5 { animation-delay: 1.4s; }
    
    /* Retraso del brillo infinito (inicia progresivamente tras finalizar el nacimiento) */
    .ray-group-1 { animation-delay: 2.0s; }
    .ray-group-2 { animation-delay: 2.1s; }
    .ray-group-3 { animation-delay: 2.2s; }
    .ray-group-4 { animation-delay: 2.3s; }
    .ray-group-5 { animation-delay: 2.4s; }
    
    @keyframes draw-horizon {
      0% { stroke-dashoffset: 120; }
      100% { stroke-dashoffset: 0; }
    }
    
    @keyframes rise {
      0% { transform: translateY(45px); }
      100% { transform: translateY(0); }
    }
    
    @keyframes draw-ray {
      0% {
        stroke-dashoffset: 15;
        opacity: 0;
      }
      100% {
        stroke-dashoffset: 0;
        opacity: 1;
      }
    }
    
    @keyframes shimmer {
      0%, 100% {
        opacity: 1;
      }
      50% {
        opacity: 0.4;
      }
    }
  </style>

  <!-- Cuerpo del Sol (Corte bajo el horizonte con clipPath, trazo de 3.5px) -->
  <path class="sun-body" d="M60 120C60 97.9086 77.9086 80 100 80C122.091 80 140 97.9086 140 120" stroke="#D4AF37" stroke-width="3.5" stroke-linecap="round"/>
  
  <!-- Línea del Horizonte -->
  <path class="horizon" d="M40 120H160" stroke="#D4AF37" stroke-width="3.5" stroke-linecap="round"/>
  
  <!-- Rayos del Sol con sus contenedores de brillo (Staggered Groups) -->
  <g class="ray-group ray-group-1">
    <line class="ray ray-1" x1="100" y1="70" x2="100" y2="55" stroke="#D4AF37" stroke-width="3.5" stroke-linecap="round"/>
  </g>
  <g class="ray-group ray-group-2">
    <line class="ray ray-2" x1="128.284" y1="81.7157" x2="138.891" y2="71.1091" stroke="#D4AF37" stroke-width="3.5" stroke-linecap="round"/>
  </g>
  <g class="ray-group ray-group-3">
    <line class="ray ray-3" x1="71.7157" y1="81.7157" x2="61.1091" y2="71.1091" stroke="#D4AF37" stroke-width="3.5" stroke-linecap="round"/>
  </g>
  <g class="ray-group ray-group-4">
    <line class="ray ray-4" x1="145" y1="105" x2="160" y2="105" stroke="#D4AF37" stroke-width="3.5" stroke-linecap="round"/>
  </g>
  <g class="ray-group ray-group-5">
    <line class="ray ray-5" x1="55" y1="105" x2="40" y2="105" stroke="#D4AF37" stroke-width="3.5" stroke-linecap="round"/>
  </g>
</svg>
